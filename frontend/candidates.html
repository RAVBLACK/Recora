<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidates | Recora</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="text-slate-900">
    <main id="main-content">
        <div class="flex items-start justify-between gap-4 mb-6">
            <div>
                <p class="text-sm font-bold uppercase tracking-widest text-slate-700">Candidate database</p>
                <h1 class="text-3xl font-extrabold">Candidates</h1>
            </div>
            <div class="flex gap-2">
                <button onclick="exportToPDF('main-content', 'candidates.pdf')" class="bg-white hover:bg-slate-50 text-slate-800 font-bold py-2 px-4 rounded-lg border border-slate-300 shadow-sm transition">
                    Export as PDF
                </button>
                <button onclick="runQuickAction('Rank candidates')" class="bg-slate-950 hover:bg-slate-800 text-white px-4 py-2 rounded-lg font-bold">
                    Rank with AI
                </button>
            </div>
        </div>

        <section class="glass rounded-lg shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-white/70 text-slate-600 border-b border-slate-200 text-sm">
                            <th class="p-4 font-bold">Name</th>
                            <th class="p-4 font-bold">Role</th>
                            <th class="p-4 font-bold">Score</th>
                            <th class="p-4 font-bold">Skills</th>
                            <th class="p-4 font-bold">Status</th>
                            <th class="p-4 font-bold text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody id="candidates-table" class="text-sm"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/data-store.js"></script>
    <script src="js/resume-parser.js"></script>
    <script src="js/candidate-agent.js"></script>
    <script src="js/job-agent.js"></script>
    <script src="js/analytics-agent.js"></script>
    <script src="js/ai-agent.js"></script>
    <script src="js/main.js"></script>
    <script>
        function renderCandidates() {
            const tbody = document.getElementById("candidates-table");
            const candidates = HRDataStore.getCandidates().sort((a, b) => Number(b.score) - Number(a.score));
            tbody.innerHTML = candidates.length ? candidates.map((candidate) => `
                <tr class="border-b border-slate-100 hover:bg-white/70 transition">
                    <td class="p-4 font-bold">${escapeHtml(candidate.name)}</td>
                    <td class="p-4"><span class="px-2 py-1 bg-slate-950 text-white rounded-md text-xs font-bold">${escapeHtml(candidate.role)}</span></td>
                    <td class="p-4">
                        <div class="flex items-center gap-2">
                            <div class="w-24 bg-slate-200 rounded-full h-2">
                                <div class="bg-slate-950 h-2 rounded-full" style="width:${Number(candidate.score || 0)}%"></div>
                            </div>
                            <span>${Number(candidate.score || 0)}%</span>
                        </div>
                    </td>
                    <td class="p-4 max-w-xs">${(candidate.skills || []).slice(0, 5).map(escapeHtml).join(", ") || "Not detected"}</td>
                    <td class="p-4">${escapeHtml(candidate.status)}</td>
                    <td class="p-4 text-right">
                        <div class="flex justify-end gap-2 items-center">
                            <button onclick="deleteCandidateEntry('${escapeAttribute(candidate.id)}')" class="btn-danger text-sm">Discard</button>
                            <button onclick="runQuickAction('Evaluate candidate ${escapeAttribute(candidate.name)}')" class="text-slate-950 font-bold text-sm">Evaluate</button>
                        </div>
                    </td>
                </tr>
            `).join("") : `<tr><td colspan="6" class="p-6 text-center text-slate-500">No candidates found. Upload a resume to begin.</td></tr>`;
        }

        function deleteCandidateEntry(id) {
            HRDataStore.deleteCandidate(id);
            renderCandidates();
        }

        document.addEventListener("DOMContentLoaded", renderCandidates);
        window.addEventListener("hr:data-updated", renderCandidates);
    </script>
</body>
</html>
