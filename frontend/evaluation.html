<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluation | Recora</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="text-slate-900">
    <main id="main-content">
        <div class="flex items-start justify-between gap-4 mb-6">
            <div>
                <p class="text-sm font-bold uppercase tracking-widest text-slate-700">Candidate review</p>
                <h1 class="text-3xl font-extrabold">Evaluation</h1>
            </div>
            <button onclick="runQuickAction('I want to evaluate a candidate')" class="bg-slate-950 hover:bg-slate-800 text-white px-4 py-2 rounded-lg font-bold">
                Ask Assistant
            </button>
        </div>

        <section class="grid grid-cols-1 xl:grid-cols-[0.8fr_1.2fr] gap-6">
            <div class="glass p-5 rounded-lg shadow-sm">
                <h2 class="text-lg font-extrabold mb-4">Evaluate Candidate</h2>
                <select id="candidate-select" class="w-full border border-slate-300 rounded-lg p-3 mb-4"></select>
                <button onclick="evaluateSelected()" class="w-full bg-slate-950 hover:bg-slate-800 text-white px-4 py-3 rounded-lg font-bold">
                    Save Evaluation
                </button>
            </div>

            <div class="glass rounded-lg shadow-sm overflow-hidden">
                <div class="p-5 border-b border-slate-200">
                    <h2 class="text-lg font-extrabold">Evaluation History</h2>
                </div>
                <div id="evaluation-list" class="divide-y divide-slate-100"></div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/data-store.js"></script>
    <script src="js/resume-parser.js"></script>
    <script src="js/candidate-agent.js"></script>
    <script src="js/job-agent.js"></script>
    <script src="js/analytics-agent.js"></script>
    <script src="js/ai-agent.js"></script>
    <script src="js/main.js"></script>
    <script>
        function renderEvaluationPage() {
            const candidates = HRDataStore.getCandidates();
            document.getElementById("candidate-select").innerHTML = candidates.length
                ? candidates.map((candidate) => `<option value="${escapeAttribute(candidate.id)}">${escapeHtml(candidate.name)} - ${escapeHtml(candidate.role)}</option>`).join("")
                : `<option value="">No candidates available</option>`;

            const evaluations = HRDataStore.getEvaluations().sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            document.getElementById("evaluation-list").innerHTML = evaluations.length ? evaluations.map((evaluation) => `
                <article class="p-4">
                    <div class="flex items-center justify-between gap-3">
                        <h3 class="font-extrabold">${escapeHtml(evaluation.candidateName)}</h3>
                        <div class="flex items-center gap-2">
                            <span class="text-sm font-bold text-slate-950">${Number(evaluation.score)}%</span>
                            <button onclick="deleteEvaluationEntry('${escapeAttribute(evaluation.id)}')" class="btn-danger text-sm">Discard</button>
                        </div>
                    </div>
                    <p class="text-sm text-slate-600">${escapeHtml(evaluation.recommendation)}</p>
                    <p class="text-sm text-slate-500 mt-2">${escapeHtml(evaluation.notes || "")}</p>
                </article>
            `).join("") : `<div class="p-6 text-slate-500 text-center">No evaluations yet.</div>`;
        }

        function evaluateSelected() {
            const id = document.getElementById("candidate-select").value;
            const candidate = HRDataStore.getCandidates().find((item) => item.id === id);
            if (!candidate) return;
            HRDataStore.saveEvaluation({
                candidateId: candidate.id,
                candidateName: candidate.name,
                score: candidate.score,
                recommendation: candidate.score >= 85 ? "Strong hire signal" : "Proceed with focused screen",
                notes: candidate.summary
            });
            runQuickAction(`Evaluate candidate ${candidate.name}`);
            renderEvaluationPage();
        }

        function deleteEvaluationEntry(id) {
            HRDataStore.deleteEvaluation(id);
            renderEvaluationPage();
        }

        document.addEventListener("DOMContentLoaded", renderEvaluationPage);
        window.addEventListener("hr:data-updated", renderEvaluationPage);
    </script>
</body>
</html>
